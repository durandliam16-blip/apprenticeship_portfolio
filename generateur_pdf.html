<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Rapport PDF Structuré</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --col-entreprise: #3498db;
            --col-ecole: #e67e22;
            --col-dark: #2c3e50;
            --col-bg: #555;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--col-bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* BARRE D'OUTILS (Non imprimée) */
        .toolbar {
            background: #fff; padding: 15px 30px; border-radius: 8px; margin-bottom: 30px;
            display: flex; gap: 20px; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #btn-download {
            background-color: #e74c3c; color: white; border: none; padding: 10px 20px;
            font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        #btn-download:hover { background-color: #c0392b; }

        /* Switch Checkbox */
        .toggle-label { font-size: 14px; font-weight: bold; color: #333; cursor: pointer; display: flex; align-items: center; gap: 10px;}
        input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }

        /* FEUILLE A4 */
        #report-content {
            background: white; width: 210mm; min-height: 297mm; padding: 20mm;
            box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* EN-TÊTE */
        .header { text-align: center; border-bottom: 2px solid var(--col-dark); padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { color: var(--col-dark); font-size: 26px; text-transform: uppercase; margin: 0; }
        .header p { color: #7f8c8d; margin-top: 5px; font-size: 14px; }

        /* STRUCTURE */
        .main-section { margin-bottom: 40px; page-break-inside: avoid; }
        .section-title {
            font-size: 22px; color: white; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .bg-entreprise { background-color: var(--col-entreprise); }
        .bg-ecole { background-color: var(--col-ecole); }

        /* BLOC MISSION (PARENT) */
        .mission-block {
            border-left: 6px solid #ccc;
            margin-bottom: 30px;
            padding-left: 20px;
            page-break-inside: avoid; /* Évite de couper une mission au milieu */
        }
        .mission-block.entreprise { border-color: var(--col-entreprise); }
        .mission-block.ecole { border-color: var(--col-ecole); }

        .mission-header { display: flex; justify-content: space-between; align-items: baseline; }
        .mission-title { font-size: 18px; font-weight: 700; color: #2c3e50; margin-bottom: 8px; }
        .mission-desc { font-size: 14px; color: #555; margin-bottom: 15px; text-align: justify; line-height: 1.5; }

        /* CONTENEUR COMPÉTENCES */
        .skills-container {
            margin-left: 10px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        /* --- STYLE 1 : BADGES (Compact) --- */
        .skills-compact { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag {
            background: #f4f4f4; border: 1px solid #ddd;
            padding: 4px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600; color: #555;
            display: flex; align-items: center; gap: 6px;
        }

        /* --- STYLE 2 : LISTE DÉTAILLÉE (Complet) --- */
        .skills-detailed { display: flex; flex-direction: column; gap: 10px; }
        .skill-card {
            background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 10px;
            position: relative;
        }
        .skill-card-title { font-size: 13px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 8px; }
        .skill-card-desc { font-size: 12px; color: #666; margin-top: 4px; line-height: 1.4; padding-left: 18px; }

        /* PASTILLES COULEURS */
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-tech { background: #e74c3c; }
        .dot-soft { background: #2ecc71; }
        .dot-other { background: #f1c40f; }

        .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #aaa; border-top: 1px solid #eee; padding-top: 10px; }

    </style>
</head>
<body>

    <div class="toolbar">
        <button id="btn-download" onclick="generatePDF()">🖨️ Télécharger le PDF</button>
        <label class="toggle-label">
            <input type="checkbox" id="toggle-details" onchange="refreshView()" checked>
            Afficher le détail des compétences
        </label>
    </div>

    <div id="report-content">
        <div class="header">
            <h1>Dossier de Suivi - Alternance</h1>
            <p>Synthèse Hiérarchique des Missions et Compétences</p>
            <p><strong>Date :</strong> <span id="date-jour"></span></p>
        </div>
        <div id="content-injection"></div>
        <div class="footer">Document généré automatiquement depuis le Portfolio Interactif.</div>
    </div>

    <script>
        document.getElementById('date-jour').innerText = new Date().toLocaleDateString('fr-FR');
        let globalData = null; // Pour stocker le JSON

        // 1. CHARGEMENT DES DONNÉES
        fetch('data_s5.json')
            .then(res => res.json())
            .then(data => {
                globalData = data;
                renderContent(); // Premier affichage
            })
            .catch(err => {
                document.getElementById('content-injection').innerHTML = "<p style='color:red; text-align:center'>Erreur : Impossible de lire data_s5.json. Lancez via Live Server.</p>";
                console.error(err);
            });

        // 2. FONCTION DE RENDU (Appelée au chargement et au clic sur la checkbox)
        function renderContent() {
            if (!globalData) return;

            const showDetails = document.getElementById('toggle-details').checked;
            const container = document.getElementById('content-injection');
            const nodes = globalData.nodes;
            const edges = globalData.edges;
            const details = globalData.popupContent;

            // --- Utilitaires ---
            const getNodeInfo = (id) => {
                if (details[id]) return details[id];
                const basicNode = nodes.find(n => n.id === id);
                if (basicNode) return { title: basicNode.label, detail: "", group: basicNode.group };
                return null;
            };

            const getChildrenIds = (parentId) => {
                return edges.filter(e => e.from === parentId).map(e => e.to);
            };

            const getDotClass = (id, info) => {
                const grp = info.group || (nodes.find(n => n.id === id)?.group);
                if(grp === 'tech') return 'dot-tech';
                if(grp === 'soft') return 'dot-soft';
                return 'dot-other';
            };

            // --- Générateur de Section ---
            const generateSection = (rootId, title, cssClass) => {
                const missionIds = getChildrenIds(rootId);
                if (missionIds.length === 0) return '';

                let html = `<div class="main-section"><div class="section-title bg-${cssClass}">${title}</div>`;

                missionIds.forEach(mId => {
                    const missionInfo = getNodeInfo(mId);
                    if (!missionInfo) return;
                    const skillIds = getChildrenIds(mId);

                    // Bloc Mission
                    html += `
                    <div class="mission-block ${cssClass}">
                        <div class="mission-header">
                            <div class="mission-title">${missionInfo.title}</div>
                        </div>
                        <div class="mission-desc">${missionInfo.detail || "Description non disponible."}</div>
                        
                        <div class="skills-container">`;

                    // Gestion des Compétences (Enfants)
                    if (skillIds.length > 0) {
                        // Choix de l'affichage selon la checkbox
                        if (showDetails) {
                            // MODE DÉTAILLÉ
                            html += `<div class="skills-detailed">`;
                            skillIds.forEach(sId => {
                                const skillInfo = getNodeInfo(sId);
                                if (skillInfo) {
                                    const dot = getDotClass(sId, skillInfo);
                                    html += `
                                    <div class="skill-card">
                                        <div class="skill-card-title"><span class="dot ${dot}"></span>${skillInfo.title}</div>
                                        <div class="skill-card-desc">${skillInfo.detail || "Pas de description."}</div>
                                    </div>`;
                                }
                            });
                            html += `</div>`;
                        } else {
                            // MODE COMPACT (BADGES)
                            html += `<div class="skills-compact">`;
                            skillIds.forEach(sId => {
                                const skillInfo = getNodeInfo(sId);
                                if (skillInfo) {
                                    const dot = getDotClass(sId, skillInfo);
                                    html += `<div class="skill-tag"><span class="dot ${dot}"></span>${skillInfo.title}</div>`;
                                }
                            });
                            html += `</div>`;
                        }
                    } else {
                        html += `<small style="color:#aaa; font-style:italic;">Aucune sous-compétence liée.</small>`;
                    }

                    html += `</div></div>`; // Fin skills-container & mission-block
                });
                html += `</div>`;
                return html;
            };

            // Injection
            let finalHTML = "";
            finalHTML += generateSection(1, "🏢 Entreprise (ADEME)", "entreprise");
            finalHTML += generateSection(2, "🎓 École (Polytech)", "ecole");
            finalHTML += generateSection(3, "💻 Projets Personnels", "entreprise"); 

            container.innerHTML = finalHTML;
        }

        // 3. REFRESH VIEW (Quand on clique sur la checkbox)
        function refreshView() {
            renderContent();
        }

        // 4. GÉNÉRATION PDF
        function generatePDF() {
            const element = document.getElementById('report-content');
            const opt = {
                margin: 10,
                filename: 'Mon_Dossier_Hierarchique.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
